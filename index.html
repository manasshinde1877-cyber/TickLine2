<!DOCTYPE html>
<html lang="en">
<head>
<title>Tickline</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Tickline – live crypto charts powered by Binance">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ============================================================
   DESIGN TOKENS — dark & light
   ============================================================ */
:root{
  --bg:#0d0d0d; --panel:#141414; --raise:#1c1c1c; --line:#2a2a2a; --grid:#181818;
  --text:#e2e2e2; --dim:#888; --accent:#d4a853;
  --up:#3ecf8e; --down:#e05252;
  --amber:#d4a853; --violet:#b48eff; --teal:#38c8d4;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#f4f1ec; --panel:#faf8f4; --raise:#ede9e1; --line:#d8d2c7; --grid:#ede9e1;
  --text:#1a1a1a; --dim:#7a7060; --accent:#b8873a;
  --up:#1a9e6a; --down:#c94040;
  --amber:#b8873a; --violet:#7c5cbf; --teal:#1a9ea8;
  color-scheme:light;
}

/* ============================================================
   BASE
   ============================================================ */
html,body{height:100%;margin:0;overflow:hidden}
#app{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--text);
  font:13px/1.4 var(--sans);overflow:hidden;
  padding-inline:max(16px,env(safe-area-inset-left,0px));
  transition:background .22s,color .22s;
}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;transition:background .15s,color .15s}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ============================================================
   APP GRID
   ============================================================ */
#app{
  height:100%;display:grid;gap:0;overflow:hidden;
  grid-template-columns:var(--tools-w,44px) minmax(0,1fr) var(--watch-w,208px);
  grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"top top top" "tools grid watch";
  transition:grid-template-columns .18s;
}
#app.tools-hidden{--tools-w:0px}
#app.watch-hidden{--watch-w:0px}

/* ============================================================
   TOP BAR
   ============================================================ */
#top{
  grid-area:top;display:flex;flex-wrap:wrap;align-items:center;
  gap:8px 14px;padding:8px 0;border-bottom:1px solid var(--line);
  transition:border-color .22s;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.02em;font-size:15px}
.mark{
  width:14px;height:14px;border-radius:3px;
  background:linear-gradient(135deg,var(--amber) 0 50%,var(--up) 50% 100%);
}
.sp{flex:1}
.seg{
  display:flex;background:var(--panel);border:1px solid var(--line);
  border-radius:6px;overflow:hidden;transition:background .22s,border-color .22s;
}
.seg button{
  border:0;background:transparent;padding:5px 9px;color:var(--dim);
  display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;
}
.seg button:hover{color:var(--text);background:var(--raise)}
.seg button.on{background:var(--accent);color:var(--bg)}
.seg svg{display:block}
.btn{
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:5px 11px;transition:background .15s,border-color .22s;
}
.btn:hover{background:var(--raise)}
.chk{display:flex;align-items:center;gap:6px;color:var(--dim);user-select:none}

/* feed */
.feed{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.feed i{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.feed.ok i{background:var(--up);animation:pulse 1.6s ease-in-out infinite}
.feed.bad i{background:var(--down)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.feed.ok i{animation:none}}

/* theme toggle */
#themeBtn{
  width:34px;height:28px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel);display:grid;place-items:center;padding:0;
}
#themeBtn svg{width:16px;height:16px;stroke:var(--dim);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .22s}
#themeBtn:hover svg{stroke:var(--text)}
.sun-icon{display:none}
[data-theme="light"] .moon-icon{display:none}
[data-theme="light"] .sun-icon{display:block}

/* overlay message */
.msg{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  padding:16px;color:var(--dim);pointer-events:none;z-index:4;line-height:1.5;
}
.msg:empty{display:none}

/* ============================================================
   INDICATOR POPOVER  — centered modal overlay
   ============================================================ */
.panel-actions{position:relative;margin-left:auto;display:flex;align-items:center;gap:6px}
.panel-recenter-btn{
  background:var(--raise);border:1px solid var(--line);border-radius:5px;
  padding:2px 8px;font-size:11px;color:var(--dim);cursor:pointer;
  white-space:nowrap;display:inline-flex;align-items:center;gap:4px;
  transition:background .15s,color .15s,border-color .15s;
  font-family:var(--sans);
}
.panel-recenter-btn:hover{color:var(--text);border-color:var(--accent);background:var(--panel)}
.panel-float-recenter{
  position:absolute;right:78px;bottom:30px;z-index:15;
  width:26px;height:26px;border-radius:50%;
  background:var(--panel);border:1px solid var(--line);
  color:var(--dim);display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;
  box-shadow:0 2px 8px rgba(0,0,0,0.25);
  transition:background .15s,color .15s,border-color .15s,transform .15s;
}
.panel-float-recenter:hover{
  color:var(--accent);border-color:var(--accent);background:var(--raise);
  transform:scale(1.08);
}
.panel-ind-btn{
  background:var(--raise);border:1px solid var(--line);border-radius:5px;
  padding:2px 8px;font-size:11px;color:var(--dim);cursor:pointer;
  white-space:nowrap;transition:background .15s,color .15s,border-color .15s;
  font-family:var(--sans);
}
.panel-ind-btn:hover,.panel-ind-btn.open{color:var(--text);border-color:var(--accent);background:var(--panel)}
.panel-ind-btn.has-ind{color:var(--accent)}
.pop-wrap{position:relative}
.pop{
  position:absolute;top:calc(100% + 6px);left:0;z-index:30;
  background:var(--raise);border:1px solid var(--line);border-radius:8px;
  padding:6px 6px 8px;min-width:280px;max-height:480px;overflow-y:auto;
  box-shadow:0 12px 32px rgba(0,0,0,.4);
  transition:background .22s,border-color .22s;
}
/* Indicator modal overlay — always centered on screen */
#ind-modal-backdrop{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;
}
#ind-modal-backdrop[hidden]{display:none!important}
.panel-ind-pop{
  position:relative;z-index:201;
  background:var(--raise);border:1px solid var(--line);border-radius:10px;
  padding:0 0 8px;min-width:320px;max-width:420px;width:min(420px,92vw);
  max-height:min(560px,88vh);display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  transition:background .22s,border-color .22s;
}
.ind-modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px 6px;border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.ind-modal-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.ind-modal-close{
  background:transparent;border:0;color:var(--dim);font-size:18px;line-height:1;
  cursor:pointer;padding:0 2px;
}
.ind-modal-close:hover{color:var(--text)}
.ind-modal-body{flex:1;overflow-y:auto;padding:4px 6px 0}
.pop h3,.ind-modal-body h3{
  margin:8px 8px 4px;font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:.1em;color:var(--dim);
}
.pop .note,.ind-modal-body .note{margin:6px 8px 2px;color:var(--dim);font-size:11px}

/* indicator rows */
.ind-row{border-radius:5px;margin:1px 2px}
.ind-row:hover{background:var(--panel)}
.ind-chk{
  display:flex;align-items:center;gap:7px;cursor:pointer;
  padding:4px 6px;user-select:none;color:var(--text);
}
.ind-params{
  display:flex;align-items:center;gap:5px 10px;
  padding:1px 6px 6px 28px;flex-wrap:wrap;
}
.plbl{
  font-size:10px;color:var(--dim);text-transform:uppercase;
  letter-spacing:.06em;white-space:nowrap;
}
/* number inputs inside indicator popup */
.pnum{
  width:48px;background:var(--panel);border:1px solid var(--line);
  border-radius:4px;padding:2px 5px;color:var(--text);
  font-family:var(--mono);font-size:11px;text-align:center;
  -moz-appearance:textfield;
  transition:border-color .15s;
}
.pnum::-webkit-outer-spin-button,.pnum::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pnum:focus{border-color:var(--accent);outline:none}

/* multi-instance indicator groups */
.ind-group{margin:2px 2px 6px;border-radius:6px;transition:background .15s}
.ind-grp-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:3px 6px 2px;font-weight:500;
}
.ind-grp-title{font-size:12px;color:var(--text)}
.ind-add-btn{
  background:var(--panel);border:1px solid var(--line);border-radius:4px;
  padding:1px 6px;font-size:11px;color:var(--dim);cursor:pointer;
  line-height:1.3;font-family:var(--sans);
}
.ind-add-btn:hover{color:var(--text);border-color:var(--accent);background:var(--raise)}
.ind-inst-row{
  display:flex;align-items:center;gap:6px;padding:2px 6px 3px 12px;
  border-radius:4px;
}
.ind-inst-row:hover{background:var(--panel)}
.ind-inst-badge{
  width:7px;height:7px;border-radius:50%;flex-shrink:0;
}
.ind-del-btn{
  background:transparent;border:0;color:var(--dim);font-size:14px;
  cursor:pointer;padding:0 4px;line-height:1;margin-left:auto;
}
.ind-del-btn:hover{color:var(--down)}
.ind-empty{
  font-size:11px;color:var(--dim);padding:1px 6px 3px 14px;font-style:italic;
}

/* ============================================================
   TOOL RAIL
   ============================================================ */
#tools{
  grid-area:tools;display:flex;flex-direction:column;align-items:center;
  gap:4px;padding:8px 0;border-right:1px solid var(--line);
  overflow:hidden;transition:border-color .22s;
}
#app.tools-hidden #tools{border-right:0;padding:0}
#tools button{
  width:34px;height:34px;display:grid;place-items:center;
  border:1px solid transparent;border-radius:6px;background:transparent;color:var(--dim);
}
#tools button:hover{background:var(--raise);color:var(--text)}
#tools button.on{background:var(--raise);color:var(--accent);border-color:var(--accent)}
#tools hr{width:24px;border:0;border-top:1px solid var(--line);margin:4px 0}
#tools input[type=color]{
  width:26px;height:26px;padding:0;border:1px solid var(--line);
  border-radius:50%;background:none;cursor:pointer;
}
#tools svg{
  width:20px;height:20px;stroke:currentColor;fill:none;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
}
/* collapse toggle tabs */
.collapse-tab{
  position:absolute;top:50%;transform:translateY(-50%);
  width:14px;height:40px;background:var(--raise);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:10px;color:var(--dim);z-index:20;border-radius:0;
  transition:background .15s,color .15s;
}
.collapse-tab:hover{background:var(--panel);color:var(--accent)}
#tools-tab{left:44px;border-left:0;border-radius:0 4px 4px 0}
#app.tools-hidden #tools-tab{left:0}
#watch-tab{right:208px;border-right:0;border-radius:4px 0 0 4px}
#app.watch-hidden #watch-tab{right:0}

/* ============================================================
   CHART GRID
   ============================================================ */
#grid{grid-area:grid;display:grid;gap:1px;background:var(--line);min-height:0;min-width:0;overflow:hidden;transition:background .22s}
#grid.l1{grid-template:minmax(0,1fr)/minmax(0,1fr)}
#grid.l2{grid-template:minmax(0,1fr)/repeat(2,minmax(0,1fr))}
#grid.l4{grid-template:repeat(2,minmax(0,1fr))/repeat(2,minmax(0,1fr))}
#grid.l6{grid-template:repeat(2,minmax(0,1fr))/repeat(3,minmax(0,1fr))}
#grid.l8{grid-template:repeat(2,minmax(0,1fr))/repeat(4,minmax(0,1fr))}
#grid.drawing .mw{cursor:crosshair!important}

.panel{
  display:flex;flex-direction:column;min-width:0;min-height:0;
  background:var(--panel);border:1px solid transparent;position:relative;
  transition:background .22s,border-color .15s;
}
.panel.active{border-color:var(--accent)}
/* Ensure hidden panels take zero space in the grid */
.panel[hidden]{display:none!important}
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;padding:6px 10px 4px;min-width:0}
.phead select{
  background:var(--raise);border:1px solid var(--line);border-radius:5px;
  padding:2px 4px;max-width:100%;transition:background .22s,border-color .22s;
}
.px{font-size:15px;font-weight:500}
.chg{font-size:12px}
.ohlc{flex-basis:100%;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ohlc b{font-weight:400;color:var(--text)}
.up{color:var(--up)} .down{color:var(--down)}
.pbody{flex:1;min-height:0;display:flex;flex-direction:column}
.mw{position:relative;flex:1;min-height:0}
.ch{position:absolute;inset:0;width:100%;height:100%}
/* Drawing overlay canvas — sits on top of chart canvas, intercepts nothing */
.mw canvas.draw-cv{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.sub{flex:0 0 28%;min-height:60px;max-height:70%;position:relative;border-top:1px solid var(--line);transition:border-color .22s}
.sub-handle{position:absolute;top:-4px;left:0;right:0;height:8px;cursor:ns-resize;z-index:10}
.sub-handle:hover::after,.sub-handle:active::after{content:'';position:absolute;top:3px;left:20%;right:20%;height:2px;background:var(--accent);border-radius:2px}
.sublbl{position:absolute;left:8px;top:3px;z-index:3;font-size:11px;color:var(--dim);font-family:var(--mono)}

/* ============================================================
   WATCHLIST
   ============================================================ */
#watch{
  grid-area:watch;border-left:1px solid var(--line);padding:8px 0 8px 10px;
  overflow-y:auto;min-width:0;transition:border-color .22s;
}
#watch h2{margin:2px 0 8px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
#wl{list-style:none;margin:0;padding:0}
#wl li{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:6px 8px;border-radius:6px;cursor:pointer;transition:background .15s}
#wl li:hover{background:var(--raise)}
#wl li.cur{background:var(--raise);box-shadow:inset 2px 0 var(--accent)}
#wl .n{font-weight:600}
#wl .d{grid-column:1;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wl .p{text-align:right;transition:color .25s}
#wl .c{text-align:right;font-size:11px}
#wl .flashu{color:var(--up)} #wl .flashd{color:var(--down)}

/* ============================================================
   ZEN MODE
   ============================================================ */
#app.zen #top{display:none}
#app.zen #tools{display:none}
#app.zen #watch{display:none}
#app.zen{
  grid-template-columns:0 minmax(0,1fr) 0;
  grid-template-rows:minmax(0,1fr);
  grid-template-areas:"grid grid grid";
}
/* Zen label — symbol + timeframe pill shown in top-left of each panel */
.zen-label{
  position:absolute;top:8px;left:10px;z-index:10;
  font-family:var(--mono);font-size:11px;color:var(--dim);
  background:transparent;pointer-events:none;
  opacity:0;transition:opacity .2s;
}
#app.zen .zen-label{opacity:1}
/* Hide the normal panel header controls in zen, keep the panel body full */
#app.zen .phead{display:none}
/* Zen exit pill — shown in zen mode */
#zen-exit{
  position:fixed;top:10px;right:12px;z-index:50;
  background:var(--raise);border:1px solid var(--line);border-radius:5px;
  padding:3px 10px;font-size:11px;color:var(--dim);cursor:pointer;
  font-family:var(--sans);opacity:0;pointer-events:none;
  transition:opacity .2s,color .15s,background .15s;
}
#app.zen #zen-exit{opacity:1;pointer-events:auto}
#zen-exit:hover{color:var(--text);background:var(--panel)}
#zenBtn{
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:5px 11px;font-size:12px;color:var(--dim);cursor:pointer;
  transition:background .15s,color .15s,border-color .22s;font-family:var(--sans);
}
#zenBtn:hover{background:var(--raise);color:var(--text)}
#app.zen #zenBtn{display:none}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:860px){
  body{overflow:auto}
  #app{height:auto;min-height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;grid-template-areas:"top" "tools" "grid"}
  #watch{display:none}
  #tools{flex-direction:row;flex-wrap:wrap;justify-content:flex-start;border-right:0;border-bottom:1px solid var(--line);padding:6px 0}
  #tools hr{width:0;height:24px;border-top:0;border-left:1px solid var(--line);margin:0 4px}
  #grid,#grid.l1,#grid.l2,#grid.l4,#grid.l6,#grid.l8{grid-template:none;grid-template-columns:minmax(0,1fr);grid-auto-rows:380px}
  #top .sp,.feed{display:none}
  #top{overflow:visible}
  .seg{max-width:100%;overflow-x:auto}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><span class="mark"></span>Tickline</div>
    <div class="seg" id="layouts" role="group" aria-label="Charts on screen"></div>
    <div class="seg" id="tfs" role="group" aria-label="Timeframe"></div>
    <label class="chk" for="syncTf"><input type="checkbox" id="syncTf"> Apply to all charts</label>
    <span class="sp"></span>
    <button id="zenBtn" title="Toggle Zen mode (Z)" aria-label="Toggle Zen mode">Zen</button>
    <button id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
      <svg class="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
      <svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
    <span class="feed wait" id="feed" role="status"><i></i><span id="feedTxt">Connecting</span></span>
    <span class="mono" id="clock"></span>
  </header>
  <nav id="tools" aria-label="Drawing tools"></nav>
  <main id="grid" class="l4"></main>
  <aside id="watch"><h2>Watchlist</h2><ul id="wl"></ul></aside>
</div>
<!-- Shared indicator modal backdrop -->
<div id="ind-modal-backdrop" hidden>
  <div class="panel-ind-pop">
    <div class="ind-modal-header">
      <span class="ind-modal-title">Indicators</span>
      <button class="ind-modal-close" id="ind-modal-close-btn" aria-label="Close">×</button>
    </div>
    <div class="ind-modal-body" id="ind-modal-body"></div>
  </div>
</div>
<!-- Zen mode exit pill -->
<button id="zen-exit" title="Exit Zen mode (Z)">✕ Zen</button>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
'use strict';

/* ============================================================
   THEME
   ============================================================ */
(function(){
  const saved = localStorage.getItem('tickline.theme');
  if (saved === 'light') document.documentElement.setAttribute('data-theme','light');
})();

function toggleTheme(){
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  document.documentElement.setAttribute('data-theme', isLight ? 'dark' : 'light');
  localStorage.setItem('tickline.theme', isLight ? 'dark' : 'light');
  rebuildColors();
  if (typeof App !== 'undefined') App.panels.forEach(p => p.applyTheme());
}
document.getElementById('themeBtn').onclick = toggleTheme;

/* ============================================================
   MARKET DATA  — Binance public REST + WebSocket, no key
   ============================================================ */
const OFF  = -new Date().getTimezoneOffset() * 60;
const TFS  = [['1s',1],['5s',5],['1m',60],['5m',300],['10m',600],['15m',900],['1h',3600],['24h',86400]];
const KL   = {1:['1s',1],5:['1s',5],60:['1m',1],300:['5m',1],600:['5m',2],900:['15m',1],3600:['1h',1],86400:['1d',1]};
const SYMS = [
  {id:'BTCUSDT',name:'Bitcoin',dec:2},{id:'ETHUSDT',name:'Ethereum',dec:2},
  {id:'XAUTUSDT',name:'Tether Gold',dec:2},{id:'PAXGUSDT',name:'PAX Gold',dec:2},
];
const S = {};

  {price:null,prev:null,last:null,chgPct:null,tickV:0,volAcc:0,hiAcc:-Infinity,loAcc:Infinity,hi:null,lo:null}, s));

const REST = ['https://api.binance.com','https://data-api.binance.vision'];
const WSH  = ['wss://stream.binance.com:9443','wss://data-stream.binance.vision'];
const Feed = {host:0,tries:0,everOpen:false,needReload:false,skew:0,restIdx:0};
const nowUtc = () => (Date.now() + Feed.skew) / 1000;
const bkt   = (utcSec, tf) => Math.floor(utcSec / tf) * tf + OFF;

async function jget(path){
  let err;
  for (let k=0; k<REST.length; k++){
    const h = REST[(Feed.restIdx+k) % REST.length];
    try { const r=await fetch(h+path); if(!r.ok) throw new Error('HTTP '+r.status); Feed.restIdx=(Feed.restIdx+k)%REST.length; return await r.json(); }
    catch(e){ err=e; }
  }
  throw err;
}

function fillGaps(a, tf){
  const out = [];
  for (let i=0; i<a.length; i++){
    if (i){ let t=a[i-1].t+tf, pc=a[i-1].c, k=0; while(t<a[i].t&&k<3000){ out.push({t,o:pc,h:pc,l:pc,c:pc,v:0}); t+=tf; k++; } }
    out.push(a[i]);
  }
  return out;
}

async function fetchBars(sym, tf){
  const [iv]=KL[tf];
  const rows=await jget(`/api/v3/klines?symbol=${sym}&interval=${iv}&limit=1000`);
  const out=[]; let cur=null;
  for (const r of rows){
    const t=bkt(Math.floor(r[0]/1000),tf), o=+r[1], h=+r[2], l=+r[3], c=+r[4], v=+r[5];
    if (!cur||cur.t!==t){ cur={t,o,h,l,c,v}; out.push(cur); }
    else { if(h>cur.h)cur.h=h; if(l<cur.l)cur.l=l; cur.c=c; cur.v+=v; }
  }
  if (!out.length) throw new Error('no candles returned');
  const s=S[sym]; if(s.price==null){ s.price=out[out.length-1].c; s.hi=s.lo=s.price; }
  return fillGaps(out, tf);
}

function flushTicks(){
  for (const id in S){
    const s=S[id]; if(s.price==null) continue;
    s.prev=s.last==null?s.price:s.last; s.last=s.price;
    s.tickV=s.volAcc; s.hi=isFinite(s.hiAcc)?Math.max(s.hiAcc,s.price):s.price; s.lo=isFinite(s.loAcc)?Math.min(s.loAcc,s.price):s.price;
    s.volAcc=0; s.hiAcc=-Infinity; s.loAcc=Infinity;
  }
}

function setFeed(state,text){
  const f=document.getElementById('feed'); if(!f) return;
  f.className='feed '+state; document.getElementById('feedTxt').textContent=text;
}

function connectFeed(){
  const streams=SYMS.map(s=>{ const l=s.id.toLowerCase(); return l+'@aggTrade/'+l+'@ticker'; }).join('/');
  let ws, opened=false;
  setFeed('wait','Connecting');
  try { ws=new WebSocket(WSH[Feed.host%WSH.length]+'/stream?streams='+streams); } catch(e){ return retry(); }
  ws.onopen  = () => { opened=true; Feed.tries=0; Feed.everOpen=true; setFeed('ok','Binance live'); if(Feed.needReload){ Feed.needReload=false; App.panels.forEach(p=>p.load()); } };
  ws.onmessage = ev => {
    let d; try{ d=JSON.parse(ev.data).data; }catch(e){ return; }
    const s=d&&S[d.s]; if(!s) return;
    if (d.e==='aggTrade'){ const p=+d.p; s.price=p; s.volAcc+=+d.q; if(p>s.hiAcc)s.hiAcc=p; if(p<s.loAcc)s.loAcc=p; Feed.skew=d.T-Date.now(); }
    else if (d.e==='24hrTicker'){ s.chgPct=+d.P; if(s.price==null)s.price=+d.c; }
  };
  ws.onerror = () => { try{ ws.close(); }catch(e){} };
  ws.onclose = () => { if(Feed.everOpen)Feed.needReload=true; if(!opened)Feed.host++; retry(); };
  function retry(){ Feed.tries++; setFeed('bad',Feed.everOpen?'Reconnecting':'No connection to Binance'); setTimeout(connectFeed,Math.min(15000,1000*Feed.tries)); }
}

const fv = v => v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':v.toFixed(v<10?3:1);
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function formatTimeBadge(t, tf){
  const d = new Date((t - OFF) * 1000);
  const pad = n => String(n).padStart(2, '0');
  const dayStr = `${d.getDate()} ${MONTH_NAMES[d.getMonth()]}`;
  const timeStr = `${pad(d.getHours())}:${pad(d.getMinutes())}` + (tf <= 5 ? `:${pad(d.getSeconds())}` : '');

/* ============================================================
   INDICATORS — pure functions, all periods configurable
   ============================================================ */
function sma(a,n){ const o=new Array(a.length).fill(null); let s=0; for(let i=0;i<a.length;i++){ s+=a[i]; if(i>=n)s-=a[i-n]; if(i>=n-1)o[i]=s/n; } return o; }
function ema(a,n,from=0){ const o=new Array(a.length).fill(null),k=2/(n+1); let e=null; for(let i=from;i<a.length;i++){ if(a[i]==null)continue; e=e==null?a[i]:a[i]*k+e*(1-k); if(i>=from+n-1)o[i]=e; } return o; }
function dema(a,n){
  const e1 = ema(a, n);
  const first = e1.findIndex(v => v != null);
  const e2 = first < 0 ? e1.map(() => null) : ema(e1, n, first);
  return a.map((_, i) => (e1[i] != null && e2[i] != null) ? 2 * e1[i] - e2[i] : null);
}
function boll(a,n,m){ const mid=sma(a,n),up=[],lo=[]; for(let i=0;i<a.length;i++){ if(mid[i]==null){up.push(null);lo.push(null);continue;} let q=0; for(let j=i-n+1;j<=i;j++) q+=(a[j]-mid[i])**2; const sd=Math.sqrt(q/n); up.push(mid[i]+m*sd); lo.push(mid[i]-m*sd); } return {mid,up,lo}; }
function vwap(b){ const o=[]; let pv=0,vv=0,day=-1; for(const x of b){ const d=Math.floor((x.t-OFF)/86400); if(d!==day){day=d;pv=0;vv=0;} const tp=(x.h+x.l+x.c)/3; pv+=tp*x.v; vv+=x.v; o.push(vv?pv/vv:tp); } return o; }
function calcPivots(bars){
  if (!bars || !bars.length) return null;
  const days = new Map();
  for (const b of bars){
    const day = Math.floor((b.t - OFF) / 86400);
    if (!days.has(day)) days.set(day, {h:b.h, l:b.l, c:b.c});
    else {
      const d = days.get(day);
      if (b.h > d.h) d.h = b.h;
      if (b.l < d.l) d.l = b.l;
      d.c = b.c;
    }
  }
  const dayKeys = [...days.keys()].sort((a,b)=>a-b);
  const prev = dayKeys.length >= 2 ? days.get(dayKeys[dayKeys.length-2]) : days.get(dayKeys[0]);
  if (!prev) return null;
  const H = prev.h, L = prev.l, C = prev.c;
  const PP = (H + L + C) / 3;
  return {
    PP,
    R1: 2*PP - L,
    S1: 2*PP - H,
    R2: PP + (H - L),
    S2: PP - (H - L),
    R3: H + 2*(PP - L),
    S3: L - 2*(H - PP),
  };
}
function rsi(a,n){ const o=new Array(a.length).fill(null); let g=0,l=0; for(let i=1;i<a.length;i++){ const d=a[i]-a[i-1],up=Math.max(d,0),dn=Math.max(-d,0); if(i<=n){ g+=up; l+=dn; if(i===n){ g/=n; l/=n; o[i]=l?100-100/(1+g/l):100; } } else { g=(g*(n-1)+up)/n; l=(l*(n-1)+dn)/n; o[i]=l?100-100/(1+g/l):100; } } return o; }
function macd(a,f,s,g){ const ef=ema(a,f),es=ema(a,s),m=a.map((_,i)=>ef[i]!=null&&es[i]!=null?ef[i]-es[i]:null); const first=m.findIndex(v=>v!=null); const sig=first<0?m.map(()=>null):ema(m,g,first); return {m,sig,hist:m.map((v,i)=>v!=null&&sig[i]!=null?v-sig[i]:null)}; }

const IND_DEF = {
  vol: false, vwap: false, pivots: false,
  smaList: [], emaList: [], demaList: [], bbList: [],
  sub: null, rsiN: 14, macdF: 12, macdS: 26, macdG: 9,
  rsiUpper: 70, rsiMid: 50, rsiLower: 30, rsiShowMid: false,
  rsiColor: null, rsiOBColor: null, rsiOSColor: null, rsiMidColor: null,
};

function mkInd(ov){
  const res = Object.assign({}, IND_DEF);
  if (ov){
    res.vol = !!ov.vol;
    res.vwap = !!ov.vwap;
    res.pivots = !!ov.pivots;

    // SMA backward compatibility
    if (Array.isArray(ov.smaList)){
      res.smaList = ov.smaList.map(x => ({ period: Math.max(2, +x.period || 20), color: x.color||null, width: Math.max(1,Math.min(4,+x.width||2)) }));
    } else if (ov.sma === true){
      res.smaList = [{ period: Math.max(2, +ov.smaN || 20), color: null, width: 2 }];
    } else {
      res.smaList = [];
    }

    // EMA backward compatibility
    if (Array.isArray(ov.emaList)){
      res.emaList = ov.emaList.map(x => ({ period: Math.max(2, +x.period || 50), color: x.color||null, width: Math.max(1,Math.min(4,+x.width||2)) }));
    } else if (ov.ema === true){
      res.emaList = [{ period: Math.max(2, +ov.emaN || 50), color: null, width: 2 }];
    } else {
      res.emaList = [];
    }

    // DEMA backward compatibility
    if (Array.isArray(ov.demaList)){
      res.demaList = ov.demaList.map(x => ({ period: Math.max(2, +x.period || 21), color: x.color||null, width: Math.max(1,Math.min(4,+x.width||2)) }));
    } else if (ov.dema === true){
      res.demaList = [{ period: Math.max(2, +ov.demaN || 21), color: null, width: 2 }];
    } else {
      res.demaList = [];
    }

    // Bollinger Bands backward compatibility
    if (Array.isArray(ov.bbList)){
      res.bbList = ov.bbList.map(x => ({
        period: Math.max(2, +x.period || 20),
        k: Math.max(0.1, +x.k || 2),
        color: x.color||null, width: Math.max(1,Math.min(4,+x.width||1))
      }));
    } else if (ov.bb === true){
      res.bbList = [{
        period: Math.max(2, +ov.bbN || 20),
        k: Math.max(0.1, +ov.bbK || 2),
        color: null, width: 1
      }];
    } else {
      res.bbList = [];
    }

    res.sub = (ov.sub === 'rsi' || ov.sub === 'macd') ? ov.sub : null;
    res.rsiN = Math.max(2, +ov.rsiN || 14);
    res.macdF = Math.max(2, +ov.macdF || 12);
    res.macdS = Math.max(2, +ov.macdS || 26);
    res.macdG = Math.max(2, +ov.macdG || 9);
    res.rsiUpper = +(ov.rsiUpper ?? 70) || 70;
    res.rsiMid   = +(ov.rsiMid   ?? 50) || 50;
    res.rsiLower = +(ov.rsiLower ?? 30) || 30;
    res.rsiShowMid = !!ov.rsiShowMid;
    res.rsiColor   = ov.rsiColor   || null;
    res.rsiOBColor = ov.rsiOBColor || null;
    res.rsiOSColor = ov.rsiOSColor || null;
    res.rsiMidColor= ov.rsiMidColor|| null;
  }
  return res;
}

/* Translucent band between two price levels (used for RSI OB/OS zone) */
class LevelBand {
  constructor(series, getLevels, color){
    this._series = series; this._getLevels = getLevels; this._color = color;
    const self = this;
    this._view = {
      zOrder: () => 'bottom',
      renderer: () => ({
        draw(target){
          target.useBitmapCoordinateSpace(scope => {
            const [a, b] = self._getLevels();
            const y1 = self._series.priceToCoordinate(a);
            const y2 = self._series.priceToCoordinate(b);
            if (y1 === null || y2 === null) return;
            const top = Math.min(y1, y2) * scope.verticalPixelRatio;
            const h   = Math.abs(y2 - y1) * scope.verticalPixelRatio;
            scope.context.fillStyle = self._color;
            scope.context.fillRect(0, top, scope.bitmapSize.width, h);
          });
        }
      })
    };
  }
  updateAllViews(){}
  paneViews(){ return [this._view]; }
}

      priceLineVisible: false,
      crosshairMarkerVisible: false,
      // while the user has Y-zoomed or Y-panned, only candles drive the price range
      autoscaleInfoProvider: orig => (this.yZoom === 1 && !this.yShift) ? orig() : null,
    }, extra || {}));
  }

  /* Candle autoscale, scaled around its own centre by the Y-zoom factor and shifted by yShift */
  _candleScale(orig){
    const r = orig();
    if (!r || !r.priceRange) return r;
    const shift = this.yShift || 0;
    const zoom  = this.yZoom  || 1;
    if (zoom === 1 && shift === 0) return r;
    const a = r.priceRange.minValue, b = r.priceRange.maxValue;
    const c = (a + b) / 2 + shift, h = (b - a) / 2 * zoom;
    return { priceRange:{ minValue:c - h, maxValue:c + h }, margins:r.margins };
  }

  _refreshYScale(){
    this.chart.priceScale('right').applyOptions({ autoScale:true });
    this.candles.applyOptions({});

  /* Wheel over the price axis → Y-only zoom; over the time axis → X zoom anchored at cursor */
  _onWheel(e){
    if (!this.bars.length) return;
    const {x,y} = this.local(e), pl = this.plot();
    const onPrice = x > pl.w && y <= pl.h;
    const onTime  = y > pl.h && x <= pl.w;
    if (!onPrice && !onTime) return;           // plot area: default chart behaviour
    e.preventDefault(); e.stopImmediatePropagation();
    const f = Math.exp(Math.max(-100, Math.min(100, e.deltaY)) * 0.0015); // >1 zoom out, <1 zoom in
    if (onPrice){
      this.yZoom = Math.max(0.02, Math.min(50, this.yZoom * f));
      this._refreshYScale();
    } else {
      const ts = this.chart.timeScale(), vr = ts.getVisibleLogicalRange();
      const anchor = ts.coordinateToLogical(x);
      if (!vr || anchor === null) return;
      const width = vr.to - vr.from;
      const nw = Math.max(5, Math.min(5000, width * f));
      const ratio = (anchor - vr.from) / width;
      const from = anchor - ratio * nw;
      ts.setVisibleLogicalRange({ from, to: from + nw });
    }
  }

  _buildChart(){
    rebuildColors();
    if (this.chart){ try{ this.chart.remove(); }catch(e){} }
    const ch = this.chart = LightweightCharts.createChart(this.chEl, chartOpts());
    this.candles = ch.addCandlestickSeries({upColor:C.up, downColor:C.down, borderVisible:false, wickUpColor:C.up, wickDownColor:C.down,
      autoscaleInfoProvider: orig => this._candleScale(orig)});
    this.volSeries = ch.addHistogramSeries({priceFormat:{type:'volume'}, priceScaleId:'vol', lastValueVisible:false, priceLineVisible:false});
    ch.priceScale('vol').applyOptions({scaleMargins:{top:.86, bottom:0}});

    this.sSmaList  = [];
    this.sEmaList  = [];
    this.sDemaList = [];
    this.sBbList   = [];
    this.pivotLines = [];
    this.sVwap = this._ln('#e07a5f', 2);

    ch.timeScale().subscribeVisibleLogicalRangeChange(r => {
      if (this.sub && r && !this.syncing){ this.syncing=true; this.sub.timeScale().setVisibleLogicalRange(r); this.syncing=false; }
    });
    ch.subscribeCrosshairMove(p => {
      const b = p.time !== undefined ? this.byT.get(p.time) : null;
      this.showOhlc(b || this.bars[this.bars.length-1]);
    });

    if (!this._ro){
      this._ro = new ResizeObserver(() => this._resize());
      this._ro.observe(this.el);
    }
    this._resize();
  }

  _resize(){
    const w=this.mw.clientWidth, h=this.mw.clientHeight;
    if (w>0 && h>0){
      this.chart.resize(w, h);
      if (!this.fitted && this.bars.length){ this.fit(); this.fitted=true; }
    }
    if (this.sub){
      const sw=this.subEl.clientWidth, sh=this.subEl.clientHeight;
      if (sw>0 && sh>0) this.sub.resize(sw, sh);
    }
  }

  /* ----- theme change ----- */
  applyTheme(){
    rebuildColors();
    this.chart.applyOptions(chartOpts());
    this.chart.applyOptions(crosshairOpts(App.tool==='cursor'));
    this.candles.applyOptions({upColor:C.up, downColor:C.down, wickUpColor:C.up, wickDownColor:C.down});

    this.sSmaList.forEach((s, idx) => s.applyOptions({color: (this.ind.smaList[idx]&&this.ind.smaList[idx].color) || SMA_COLORS[idx % SMA_COLORS.length]}));
    this.sEmaList.forEach((s, idx) => s.applyOptions({color: (this.ind.emaList[idx]&&this.ind.emaList[idx].color) || EMA_COLORS[idx % EMA_COLORS.length]}));
    this.sDemaList.forEach((s, idx) => s.applyOptions({
      color: (this.ind.demaList[idx]&&this.ind.demaList[idx].color) || DEMA_COLORS[idx % DEMA_COLORS.length],
      lineType: (typeof LightweightCharts !== 'undefined' && LightweightCharts.LineType ? LightweightCharts.LineType.WithSteps : 1),
    }));
    this.sBbList.forEach((grp, idx) => {
      const col = (this.ind.bbList[idx]&&this.ind.bbList[idx].color) || BB_COLORS[idx % BB_COLORS.length];
      grp.u.applyOptions({color: col});
      grp.m.applyOptions({color: rgba(col, 0.4)});
      grp.l.applyOptions({color: col});
    });
    if (this.sVwap) this.sVwap.applyOptions({color: '#e07a5f'});

    if (this.sub) this.sub.applyOptions(chartOpts({timeScale:{visible:false,borderColor:C.line}}));
    if (this.sRsi) this.sRsi.applyOptions({color:C.violet});
    if (this.sMac) this.sMac.applyOptions({color:C.accent});
    if (this.sSig) this.sSig.applyOptions({color:C.amber});

    this.syncInd(true);
  }

  /* ----- per-panel indicator popup helpers ----- */
  _closeIndPop(){
    // Close the modal if it was opened for this panel
    if (App._indModalPanel === this) App.closeIndModal();
    this.indBtn.classList.remove('open');
  }

  _positionIndPop(){
    // No-op — indicator panel is now a centered modal
  }

  /* Resizable sub-pane handle */
  _setupSubResize(){
    if (!this.subHandle) return;
    let startY=0, startH=0;
    const onMove = e => {
      const dy = startY - e.clientY;
      const pbodyH = this.pbody ? this.pbody.clientHeight : (this.el.clientHeight - 40);
      const newH = Math.max(60, Math.min(pbodyH * 0.72, startH + dy));
      this.subBox.style.flexBasis = newH + 'px';
      this._resize();
    };
    const onUp = () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
    this.subHandle.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      startY = e.clientY; startH = this.subBox.clientHeight;
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    });
  }

  _updateZenLabel(){
    const TF_LABELS = {1:'1s',5:'5s',60:'1m',300:'5m',600:'10m',900:'15m',3600:'1h',86400:'24h'};
    if (this.zenLbl) this.zenLbl.textContent = this.sym + '  ' + (TF_LABELS[this.tf] || this.tf);
  }

  /* Update the indicator button label/style to reflect active indicators */
  updateIndBtn(){
    if (!this.indBtn) return;
    const I = this.ind;
    const hasAny = I.vol || I.vwap || I.pivots ||
      (I.smaList||[]).length || (I.emaList||[]).length ||
      (I.demaList||[]).length || (I.bbList||[]).length || I.sub;
    this.indBtn.classList.toggle('has-ind', !!hasAny);
    // Build a compact summary label
    const parts = [];
    (I.smaList||[]).forEach(x => parts.push('SMA '+x.period));
    (I.emaList||[]).forEach(x => parts.push('EMA '+x.period));
    (I.demaList||[]).forEach(x => parts.push('DEMA '+x.period));
    (I.bbList||[]).forEach(x => parts.push('BB '+x.period));
    if (I.vwap) parts.push('VWAP');
    if (I.pivots) parts.push('PP');
    if (I.sub) parts.push(I.sub.toUpperCase());
    this.indBtn.textContent = parts.length ? parts.join(' · ') : 'Indicators';
    this._updateZenLabel();
  }

  /* ----- data ----- */
  async load(){
    const tok=this.loadTok=(this.loadTok||0)+1, sym=this.sym, tf=this.tf;
    this.msgEl.textContent = 'Loading '+sym+' from Binance…';
    let bars;
    try { bars = await fetchBars(sym, tf); }
    catch(e){
      if (tok!==this.loadTok) return;
      this.bars=[]; this.candles.setData([]); this.volSeries.setData([]); this.ohlcEl.textContent='';
      this.msgEl.innerHTML = 'Could not load data for '+sym+' ('+String(e.message||e).replace(/</g,'&lt;')+').<br>Check connection or symbol.';
      return;
    }
    if (tok!==this.loadTok) return;
    this.msgEl.textContent = '';
    this.bars = bars;
    this.byT  = new Map(bars.map(b => [b.t, b]));
    const d = S[sym].dec;
    const key = sym + '|' + tf;
    if (this._loadedKey !== key){ this._loadedKey = key; this.yZoom = 1; this.yShift = 0; }   // new symbol/timeframe → reset Y zoom & pan
    this.candles.applyOptions({priceFormat:{type:'price', precision:d, minMove:1/10**d}});
    this.candles.setData(bars.map(b => ({time:b.t,open:b.o,high:b.h,low:b.l,close:b.c})));
    this.syncInd(true);
    this.fitted = false;
    if (this.mw.clientWidth>0){ this.fit(); this.fitted=true; }
    this.showOhlc(bars[bars.length-1]); this.updateQuote();
  }

  fit(){ const n=this.bars.length; this.chart.timeScale().setVisibleLogicalRange({from:Math.max(0,n-110), to:n+12}); }

  recenter(){
    this.yZoom = 1;
    this.yShift = 0;
    this._refreshYScale();
    this.fit();
    if (this.bars.length) this.showOhlc(this.bars[this.bars.length-1]);
  }

  onTick(){
    const s = S[this.sym];
    if (!this.visible || !this.bars.length || s.price==null || s.hi==null) return;
    const bt = bkt(nowUtc(), this.tf), cand = x => ({time:x.t,open:x.o,high:x.h,low:x.l,close:x.c});
    let last = this.bars[this.bars.length-1], added = 0;
    if (bt > last.t){
      if ((bt-last.t)/this.tf > 500){ this.load(); return; }
      for (let t=last.t+this.tf; t<=bt; t+=this.tf){
        const o=last.c, x=t===bt?{t,o,h:Math.max(o,s.hi),l:Math.min(o,s.lo),c:s.price,v:s.tickV}:{t,o,h:o,l:o,c:o,v:0};
        this.bars.push(x); this.byT.set(t,x); this.candles.update(cand(x)); last=x; added++;
      }
    } else { last.h=Math.max(last.h,s.hi); last.l=Math.min(last.l,s.lo); last.c=s.price; last.v+=s.tickV; this.candles.update(cand(last)); }
    this.syncInd(added>1);
    this.updateQuote();
    if (!this.hover) this.showOhlc(last);
  }

  updateQuote(){
    const s=S[this.sym]; if(s.price==null) return;
    const chg=s.chgPct;
    this.pxEl.textContent=fp(this.sym,s.price); this.pxEl.className='px mono '+(chg==null||chg>=0?'up':'down');
    this.chgEl.textContent=chg==null?'':(chg>=0?'+':'')+chg.toFixed(2)+'% 24h'; this.chgEl.className='chg mono '+(chg==null||chg>=0?'up':'down');
  }

  showOhlc(b){
    if (!b) return;
    const k=b.c>=b.o?'up':'down', f=v=>fp(this.sym,v);
    this.ohlcEl.innerHTML=`O <b class="${k}">${f(b.o)}</b> H <b class="${k}">${f(b.h)}</b> L <b class="${k}">${f(b.l)}</b> C <b class="${k}">${f(b.c)}</b> Vol <b>${fv(b.v)}</b>`;
  }

  /* ----- indicators ----- */
  _p(key, def){ return Math.max(2, +(this.ind[key] ?? def) || def); }

  syncInd(full){
    const b=this.bars, n=b.length, I=this.ind, L=n-1, cl=b.map(x=>x.c);
    if (!n) return;

    // helper: set or update a line series
    const put = (s, arr, on) => {
      if (!on){ if(full) s.setData([]); return; }
      if (full){
        const d=[];
        if (arr){ for(let i=0;i<n;i++) if(arr[i]!=null) d.push({time:b[i].t,value:arr[i]}); }
        s.setData(d);
      }
      else if (arr && arr[L]!=null) s.update({time:b[L].t, value:arr[L]});
    };

    // volume
    if (full){
      this.chart.priceScale('vol').applyOptions({scaleMargins:{top:.86, bottom:0}});
      this.chart.priceScale('right').applyOptions({scaleMargins:{top:.08, bottom:I.vol?.2:.08}});
      this.volSeries.setData(I.vol ? b.map(x=>({time:x.t,value:x.v,color:rgba(x.c>=x.o?C.up:C.down,.45)})) : []);
    } else if (I.vol){
      const x=b[L]; this.volSeries.update({time:x.t,value:x.v,color:rgba(x.c>=x.o?C.up:C.down,.45)});
    }

    // SMA instances
    const smaList = I.smaList || [];
    while (this.sSmaList.length < smaList.length){
      const idx = this.sSmaList.length;
      const item = smaList[idx];
      this.sSmaList.push(this._ln(item.color || SMA_COLORS[idx % SMA_COLORS.length], item.width || 2));
    }
    while (this.sSmaList.length > smaList.length){
      const s = this.sSmaList.pop();
      try { this.chart.removeSeries(s); } catch(e){}
    }
    for (let j = 0; j < smaList.length; j++){
      const period = Math.max(2, +smaList[j].period || 20);
      const jCol = smaList[j].color || SMA_COLORS[j % SMA_COLORS.length];
      this.sSmaList[j].applyOptions({color:jCol, lineWidth:Math.max(1,Math.min(4,+smaList[j].width||2))});
      put(this.sSmaList[j], sma(cl, period), true);
    }

    // EMA instances
    const emaList = I.emaList || [];
    while (this.sEmaList.length < emaList.length){
      const idx = this.sEmaList.length;
      const item = emaList[idx];
      this.sEmaList.push(this._ln(item.color || EMA_COLORS[idx % EMA_COLORS.length], item.width || 2));
    }
    while (this.sEmaList.length > emaList.length){
      const s = this.sEmaList.pop();
      try { this.chart.removeSeries(s); } catch(e){}
    }
    for (let j = 0; j < emaList.length; j++){
      const period = Math.max(2, +emaList[j].period || 50);
      const jCol = emaList[j].color || EMA_COLORS[j % EMA_COLORS.length];
      this.sEmaList[j].applyOptions({color:jCol, lineWidth:Math.max(1,Math.min(4,+emaList[j].width||2))});
      put(this.sEmaList[j], ema(cl, period), true);
    }

    // DEMA instances
    const demaList = I.demaList || [];
    const stepLineType = (typeof LightweightCharts !== 'undefined' && LightweightCharts.LineType ? LightweightCharts.LineType.WithSteps : 1);
    while (this.sDemaList.length < demaList.length){
      const idx = this.sDemaList.length;
      const item = demaList[idx];
      this.sDemaList.push(this._ln(item.color || DEMA_COLORS[idx % DEMA_COLORS.length], item.width || 2, { lineType: stepLineType }));
    }
    while (this.sDemaList.length > demaList.length){
      const s = this.sDemaList.pop();
      try { this.chart.removeSeries(s); } catch(e){}
    }
    for (let j = 0; j < demaList.length; j++){
      const period = Math.max(2, +demaList[j].period || 21);
      const jCol = demaList[j].color || DEMA_COLORS[j % DEMA_COLORS.length];
      this.sDemaList[j].applyOptions({
        color: jCol,
        lineWidth: Math.max(1, Math.min(4, +demaList[j].width || 2)),
        lineType: stepLineType,
      });
      put(this.sDemaList[j], dema(cl, period), true);
    }

    // Bollinger Bands instances
    const bbList = I.bbList || [];
    while (this.sBbList.length < bbList.length){
      const idx = this.sBbList.length;
      const item = bbList[idx];
      const col = item.color || BB_COLORS[idx % BB_COLORS.length];
      const w = item.width || 1;
      this.sBbList.push({
        u: this._ln(col, w),
        m: this._ln(rgba(col, 0.4), w),
        l: this._ln(col, w),
      });
    }
    while (this.sBbList.length > bbList.length){
      const grp = this.sBbList.pop();
      try { this.chart.removeSeries(grp.u); } catch(e){}
      try { this.chart.removeSeries(grp.m); } catch(e){}
      try { this.chart.removeSeries(grp.l); } catch(e){}
    }
    for (let j = 0; j < bbList.length; j++){
      const period = Math.max(2, +bbList[j].period || 20);
      const k = Math.max(0.1, +bbList[j].k || 2);
      const jCol = bbList[j].color || BB_COLORS[j % BB_COLORS.length];
      const jW = Math.max(1,Math.min(4,+bbList[j].width||1));
      const bb = boll(cl, period, k);
      const grp = this.sBbList[j];
      grp.u.applyOptions({color:jCol, lineWidth:jW});
      grp.m.applyOptions({color:rgba(jCol,0.4), lineWidth:jW});
      grp.l.applyOptions({color:jCol, lineWidth:jW});
      put(grp.u, bb.up, true);
      put(grp.m, bb.mid, true);
      put(grp.l, bb.lo, true);
    }

    // VWAP
    put(this.sVwap, I.vwap ? vwap(b) : null, I.vwap);

    // Pivot Points
    if (full){
      if (this.pivotLines){
        this.pivotLines.forEach(pl => {
          try { this.candles.removePriceLine(pl); } catch(e){}
        });
        this.pivotLines = [];
      }
      if (I.pivots){
        const pvs = calcPivots(b);
        if (pvs){
          const levels = [
            { price: pvs.R3, color: '#dc2626', title: 'R3' },
            { price: pvs.R2, color: '#dc2626', title: 'R2' },
            { price: pvs.R1, color: '#dc2626', title: 'R1' },
            { price: pvs.PP, color: '#000000', title: 'PP' },
            { price: pvs.S1, color: '#16a34a', title: 'S1' },
            { price: pvs.S2, color: '#16a34a', title: 'S2' },
            { price: pvs.S3, color: '#16a34a', title: 'S3' },
          ];
          this.pivotLines = levels.map(lvl => this.candles.createPriceLine({
            price: lvl.price,
            color: lvl.color,
            lineWidth: 2,
            lineStyle: 1,
            axisLabelVisible: true,
            title: lvl.title,
          }));
        }
      }
    }

    // sub-chart
    if (this.sub){
      if (I.sub==='rsi'){
        const rsiN = this._p('rsiN',14);
        put(this.sRsi, rsi(cl,rsiN), true);
      }
      if (I.sub==='macd'){
        const mF=this._p('macdF',12), mS=Math.max(mF+1,this._p('macdS',26)), mG=this._p('macdG',9);
        const m = macd(cl,mF,mS,mG);
        put(this.sMac, m.m, true); put(this.sSig, m.sig, true);
        if (full){
          const d=[]; for(let i=0;i<n;i++) if(m.hist[i]!=null) d.push({time:b[i].t,value:m.hist[i],color:rgba(m.hist[i]>=0?C.up:C.down,.6)});
          this.sHist.setData(d);
        } else if (m.hist[L]!=null){
          this.sHist.update({time:b[L].t, value:m.hist[L], color:rgba(m.hist[L]>=0?C.up:C.down,.6)});
        }
      }
    }
    this.updateIndBtn();
  }

  buildSub(){
    if (this.sub){ this.sub.remove(); this.sub=null; }
    const kind=this.ind.sub; this.subBox.hidden=!kind;
    if (!kind) return;
    rebuildColors();
    const sc = this.sub = LightweightCharts.createChart(this.subEl, chartOpts({timeScale:{visible:false,borderColor:C.line}, handleScroll:{pressedMouseMove:true}}));

    // label reflects current params
    const rsiN  = this._p('rsiN',14);
    const mF=this._p('macdF',12), mS=Math.max(mF+1,this._p('macdS',26)), mG=this._p('macdG',9);
    this.subLbl.textContent = kind==='rsi' ? `RSI ${rsiN}` : `MACD ${mF} ${mS} ${mG}`;

    const o = {lastValueVisible:true, priceLineVisible:false};
    if (kind==='rsi'){
      const rsiLineCol = this.ind.rsiColor   || C.violet;
      const rsiOBCol   = this.ind.rsiOBColor  || 'rgba(239,68,68,0.6)';
      const rsiOSCol   = this.ind.rsiOSColor  || 'rgba(74,222,128,0.6)';
      const rsiMidCol  = this.ind.rsiMidColor || (this.ind.rsiShowMid ? 'rgba(180,180,180,0.55)' : 'rgba(150,150,150,0.2)');
      this.sRsi = sc.addLineSeries(Object.assign({color:rsiLineCol,lineWidth:1},o));
      const rU=this.ind.rsiUpper??70, rL=this.ind.rsiLower??30, rM=this.ind.rsiMid??50;
      this.sRsi.createPriceLine({price:rU, color:rsiOBCol,  lineStyle:1, lineWidth:2, axisLabelVisible:true, title:'OB'});
      this.sRsi.createPriceLine({price:rL, color:rsiOSCol,  lineStyle:1, lineWidth:2, axisLabelVisible:true, title:'OS'});
      this.sRsi.createPriceLine({price:rM, color:rsiMidCol, lineStyle:1, lineWidth:2, axisLabelVisible:false, title:''});
      // translucent #CAA8D9 tint between OS and OB
      try { this.sRsi.attachPrimitive(new LevelBand(this.sRsi, () => [rU, rL], 'rgba(202,168,217,0.36)')); } catch(e){}
    } else {
      this.sHist = sc.addHistogramSeries({priceLineVisible:false,lastValueVisible:false});
      this.sMac  = sc.addLineSeries(Object.assign({color:C.accent,lineWidth:2},o));
      this.sSig  = sc.addLineSeries(Object.assign({color:C.amber,lineWidth:1},o));
    }
    sc.timeScale().subscribeVisibleLogicalRangeChange(r => {
      if (r && !this.syncing){ this.syncing=true; this.chart.timeScale().setVisibleLogicalRange(r); this.syncing=false; }
    });
    this._resize();
    this.syncInd(true);
    this.updateIndBtn();
    const r = this.chart.timeScale().getVisibleLogicalRange(); if(r) sc.timeScale().setVisibleLogicalRange(r);
  }

  /* ----- coordinate helpers ----- */
  // X: logical index → pixel, extrapolates if off-screen so drawings don't vanish
  X(t){
    if (!this.bars.length) return null;
    const l = (t - this.bars[0].t) / this.tf;
    let x = this.chart.timeScale().logicalToCoordinate(l);
    if (x === null){
      const vr = this.chart.timeScale().getVisibleLogicalRange();
      if (!vr) return null;
      const psW = this.chart.priceScale('right').width() || 72;
      const chartW = Math.max(1, this.mw.clientWidth - psW);
      x = (l - vr.from) / (vr.to - vr.from) * chartW;
    }
    return x;
  }
  // Y: price → pixel
  Y(p){ return this.candles.priceToCoordinate(p); }

  // T: pixel-x → timestamp with fallback estimate
  T(x){
    if (!this.bars.length) return null;
    const l = this.chart.timeScale().coordinateToLogical(x);
    if (l !== null) return this.bars[0].t + Math.round(l) * this.tf;
    // fallback: estimate from visible range
    const vr = this.chart.timeScale().getVisibleLogicalRange();
    if (!vr) return null;
    const psW = this.chart.priceScale('right').width() || 72;
    const chartW = Math.max(1, this.mw.clientWidth - psW);
    const frac = Math.max(0, Math.min(1, x / chartW));
    return this.bars[0].t + Math.round(vr.from + frac * (vr.to - vr.from)) * this.tf;
  }
  // P: pixel-y → price
  P(y){ return this.candles.coordinateToPrice(y); }

  plot(){
    return {
      w: this.mw.clientWidth  - (this.chart.priceScale('right').width()  || 72),
      h: this.mw.clientHeight - (this.chart.timeScale().height()          || 25),
    };
  }

  // map drawing points to pixel coords; returns null only if Y (price) is null
  pxs(d){
    const r = d.pts.map(q => ({x:this.X(q.t), y:this.Y(q.p)}));
    if (r.some(q => q.y === null)) return null; // can't draw without valid price coords
    return r;
  }

  /* ----- mouse ----- */
  local(e){ const r=this.mw.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }

  onDown(e){
    App.setActive(this);
    if (e.button!==0 || !this.bars.length) return;
    const {x,y} = this.local(e), pl = this.plot();
    // ignore clicks in price scale or time scale areas
    if (x > pl.w + 2 || y > pl.h + 2) return;

    if (App.tool !== 'cursor'){
      // stopImmediatePropagation prevents chart library from panning/zooming
      e.stopImmediatePropagation();
      e.preventDefault();
      this.addPoint(x, y);
      return;
    }
    const hit = this.hitTest(x, y);
    if (hit){
      e.stopImmediatePropagation();
      e.preventDefault();
      this.selId = hit.d.id;
      this.drag  = {d:hit.d, mode:hit.mode, i:hit.i, t0:this.T(x), p0:this.P(y), orig:hit.d.pts.map(q=>({t:q.t,p:q.p}))};
      return;
    }
    this.selId = null;

    // Start 2D chart pan (freely movable in X & Y)
    const ts = this.chart.timeScale();
    const vr = ts.getVisibleLogicalRange();
    if (!vr) return;

    const pTop = this.candles.coordinateToPrice(0);
    const pBottom = this.candles.coordinateToPrice(pl.h);
    const pricePerPx = (pTop !== null && pBottom !== null && pl.h > 0) ? (pTop - pBottom) / pl.h : 0;
    const barsPerPx = pl.w > 0 ? (vr.to - vr.from) / pl.w : 1;

    this.pan = {
      startX: e.clientX,
      startY: e.clientY,
      from: vr.from,
      to: vr.to,
      initialYShift: this.yShift || 0,
      barsPerPx,
      pricePerPx,
      active: false,
    };
  }

  onMove(e){
    this.hover = true;
    if (!this.bars.length) return;
    const {x,y} = this.local(e), pl = this.plot();
    if (x >= 0 && x <= pl.w && y >= 0 && y <= pl.h){
      App.crosshair = { relX: x / pl.w, relY: y / pl.h, active: true };
    } else {
      if (App.crosshair) App.crosshair.active = false;
    }
    if (this.creating){
      const t=this.T(x), p=this.P(y);
      if (t!=null && p!=null) this.creating.cur={t,p};
    } else if (!this.drag && (!this.pan || !this.pan.active) && App.tool==='cursor'){
      if (x > pl.w && y <= pl.h){
        this.mw.style.cursor = 'ns-resize';
      } else if (y > pl.h && x <= pl.w){
        this.mw.style.cursor = 'ew-resize';
      } else {
        const h = this.hitTest(x,y);
        this.mw.style.cursor = h ? (h.mode==='h'?'grab':'move') : 'grab';
      }
    }
  }

  panMove(e){
    if (!this.pan || !this.bars.length) return;
    const dx = e.clientX - this.pan.startX;
    const dy = e.clientY - this.pan.startY;

    const {x,y} = this.local(e), pl = this.plot();
    if (x >= 0 && x <= pl.w && y >= 0 && y <= pl.h){
      App.crosshair = { relX: x / pl.w, relY: y / pl.h, active: true };
    }

    if (!this.pan.active){
      if (Math.hypot(dx, dy) < 3) return;
      this.pan.active = true;
      document.body.style.cursor = 'grabbing';
      this.mw.style.cursor = 'grabbing';
    }

    // 1. Horizontal movement (time scale)
    const dLogical = dx * this.pan.barsPerPx;
    this.chart.timeScale().setVisibleLogicalRange({
      from: this.pan.from - dLogical,
      to: this.pan.to - dLogical,
    });

    // 2. Vertical movement (price scale)
    if (this.pan.pricePerPx > 0){
      const dPrice = dy * this.pan.pricePerPx;
      this.yShift = this.pan.initialYShift + dPrice;
      this._refreshYScale();
    }
  }

  panEnd(){
    if (!this.pan) return;
    if (this.pan.active){
      document.body.style.cursor = '';
      this.mw.style.cursor = '';
    }
    this.pan = null;
  }

  dragMove(e){
    if (!this.drag || !this.bars.length) return;
    const {x,y}=this.local(e), t=this.T(x), p=this.P(y); if(t==null||p==null) return;
    const D=this.drag, d=D.d;
    if (D.mode==='b'){ const dt=t-D.t0,dp=p-D.p0; d.pts.forEach((q,i)=>{ q.t=D.orig[i].t+dt; q.p=D.orig[i].p+dp; }); }
    else if (isPos(d)&&D.i>0){ d.pts[D.i].p=p; d.pts[1].t=t; d.pts[2].t=t; }
    else { d.pts[D.i].t=t; d.pts[D.i].p=p; }
  }

  addPoint(x,y){
    const t=this.T(x), p=this.P(y);
    if (t==null || p==null) return;
    if (!this.creating) this.creating={type:App.tool, pts:[], cur:null};
    this.creating.pts.push({t,p});
    if (this.creating.pts.length >= NEED[this.creating.type]){
      const type = this.creating.type;
      const d = {id:++uid, type, color:App.color, pts:finishPts(type, this.creating.pts)};
      (DR[this.sym] = DR[this.sym] || []).push(d);
      this.selId = d.id; this.creating = null; App.setTool('cursor');
    }
  }

  hitTest(x,y){
    if (!this.bars.length) return null;
    const list=DR[this.sym]||[], sel=list.find(d=>d.id===this.selId);
    if (sel){ const P=this.pxs(sel); if(P) for(let i=0;i<P.length;i++) if(Math.hypot(P[i].x-x,P[i].y-y)<=8) return {d:sel,mode:'h',i}; }
    for (let k=list.length-1;k>=0;k--){ const d=list[k],P=this.pxs(d); if(P&&this.bodyHit(d,P,x,y)) return {d,mode:'b'}; }
    return null;
  }

  bodyHit(d,P,x,y){
    const pl=this.plot();
    switch(d.type){
      case 'trend': return segDist(x,y,P[0],P[1])<=6;
      case 'ruler': return segDist(x,y,P[0],P[1])<=6;
      case 'hline': return Math.abs(y-P[0].y)<=6 && x<=pl.w;
      case 'rect':  return x>=Math.min(P[0].x,P[1].x)-4&&x<=Math.max(P[0].x,P[1].x)+4&&y>=Math.min(P[0].y,P[1].y)-4&&y<=Math.max(P[0].y,P[1].y)+4;
      case 'curve': { let prev=null; for(let k=0;k<=30;k++){ const q=this.bez(P,k/30); if(prev&&segDist(x,y,prev,q)<=6) return true; prev=q; } return false; }
      default: return x>=P[0].x&&x<=P[1].x&&y>=Math.min(P[1].y,P[2].y)&&y<=Math.max(P[1].y,P[2].y);
    }
  }
  bez(P,u){ const cx=2*P[2].x-(P[0].x+P[1].x)/2,cy=2*P[2].y-(P[0].y+P[1].y)/2,a=(1-u)*(1-u),b_=2*u*(1-u),c=u*u; return {x:a*P[0].x+b_*cx+c*P[1].x,y:a*P[0].y+b_*cy+c*P[1].y}; }

  /* ----- paint drawings overlay ----- */
  render(){
    const w=this.mw.clientWidth, h=this.mw.clientHeight, dpr=window.devicePixelRatio||1, cv=this.cv;
    if (!w||!h||!this.bars.length) return;
    if (cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){
      cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
      cv.style.width=w+'px'; cv.style.height=h+'px';
    }
    const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
    const pl=this.plot();
    for (const d of (DR[this.sym]||[])) this.drawOne(g,d,d.id===this.selId,pl,w);
    const c=this.creating;
    if (c && c.cur){
      const pts=c.pts.concat([c.cur]);
      if (pts.length>=2 || c.type==='hline')
        this.drawOne(g,{type:c.type,color:App.color,pts:finishPts(c.type,pts.length>=2?pts:[c.cur])},false,pl,w,true);
    }

    // Synced crosshair dotted lines across all charts (matched by relative canvas coordinates)
    if (App.crosshair && App.crosshair.active && App.crosshair.relX !== null && App.crosshair.relY !== null){
      const cx = App.crosshair.relX * pl.w;
      const cy = App.crosshair.relY * pl.h;
      if (cx >= 0 && cx <= pl.w && cy >= 0 && cy <= pl.h){
        g.save();
        g.beginPath();
        g.rect(0, 0, pl.w, pl.h);
        g.clip();

        g.setLineDash([3, 3]);
        g.lineWidth = 1;
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        g.strokeStyle = isLight ? 'rgba(0, 0, 0, 0.45)' : 'rgba(255, 255, 255, 0.45)';

        // Vertical dotted line
        const vx = Math.round(cx) + 0.5;
        g.beginPath();
        g.moveTo(vx, 0);
        g.lineTo(vx, pl.h);
        g.stroke();

        // Horizontal dotted line
        const hy = Math.round(cy) + 0.5;
        g.beginPath();
        g.moveTo(0, hy);
        g.lineTo(pl.w, hy);
        g.stroke();

        g.restore();

        // Highlight price and time badges on the axes for this chart
        const badgeBg = C.accent;
        const badgeFg = isLight ? '#ffffff' : '#0d0d0d';

        // 1. Price Badge (on right price scale at horizontal line position)
        const price = this.P(cy);
        if (price !== null && isFinite(price)){
          const priceStr = fp(this.sym, price);
          const badgeH = 18;
          const badgeY = Math.max(1, Math.min(pl.h - badgeH - 1, Math.round(cy - badgeH / 2)));
          const badgeX = pl.w + 1;
          const badgeW = Math.max(68, w - pl.w - 2);

          g.save();
          g.fillStyle = badgeBg;
          g.beginPath();
          if (g.roundRect) g.roundRect(badgeX, badgeY, badgeW, badgeH, 3);
          else g.rect(badgeX, badgeY, badgeW, badgeH);
          g.fill();

          g.fillStyle = badgeFg;
          g.font = "600 11px 'IBM Plex Mono', monospace";
          g.textAlign = 'center';
          g.textBaseline = 'middle';
          g.fillText(priceStr, badgeX + badgeW / 2, badgeY + badgeH / 2);
          g.restore();
        }

        // 2. Time Badge (on bottom time scale at vertical line position)
        const t = this.T(cx);
        if (t !== null && isFinite(t)){
          const timeStr = formatTimeBadge(t, this.tf);
          g.save();
          g.font = "600 11px 'IBM Plex Mono', monospace";
          const tw = g.measureText(timeStr).width;
          const badgeW = Math.round(tw + 12);
          const badgeH = 18;
          const badgeX = Math.max(2, Math.min(pl.w - badgeW - 2, Math.round(cx - badgeW / 2)));
          const badgeY = pl.h + 2;

          g.fillStyle = badgeBg;
          g.beginPath();
          if (g.roundRect) g.roundRect(badgeX, badgeY, badgeW, badgeH, 3);
          else g.rect(badgeX, badgeY, badgeW, badgeH);
          g.fill();

          g.fillStyle = badgeFg;
          g.textAlign = 'center';
          g.textBaseline = 'middle';
          g.fillText(timeStr, badgeX + badgeW / 2, badgeY + badgeH / 2);
          g.restore();
        }
      }
    }
  }

  drawOne(g,d,sel,pl,w,ghost){
    const P=this.pxs(d); if(!P) return;
    g.save(); g.beginPath(); g.rect(0,0,pl.w,pl.h); g.clip();
    g.globalAlpha=ghost?.6:1; g.lineWidth=sel?2.4:1.6;
    g.strokeStyle=d.color; g.fillStyle=d.color; g.lineJoin='round';

    if (d.type==='trend'){
      g.beginPath(); g.moveTo(P[0].x,P[0].y); g.lineTo(P[1].x,P[1].y); g.stroke();
    } else if (d.type==='ruler'){
      // main line
      g.beginPath(); g.moveTo(P[0].x,P[0].y); g.lineTo(P[1].x,P[1].y); g.stroke();
      // tick marks at endpoints
      const ang=Math.atan2(P[1].y-P[0].y,P[1].x-P[0].x)+Math.PI/2;
      [[P[0].x,P[0].y],[P[1].x,P[1].y]].forEach(([ex,ey])=>{
        g.beginPath(); g.moveTo(ex+Math.cos(ang)*5,ey+Math.sin(ang)*5); g.lineTo(ex-Math.cos(ang)*5,ey-Math.sin(ang)*5); g.stroke();
      });
      // horizontal dashed line from start to end-x at start-y
      g.save(); g.globalAlpha*=0.35; g.setLineDash([4,3]);
      g.beginPath(); g.moveTo(P[0].x,P[0].y); g.lineTo(P[1].x,P[0].y); g.stroke();
      g.beginPath(); g.moveTo(P[1].x,P[0].y); g.lineTo(P[1].x,P[1].y); g.stroke();
      g.setLineDash([]); g.restore();
      // labels
      const pA=d.pts[0].p, pB=d.pts[1].p;
      const diff=pB-pA, pct=(pA?diff/pA*100:0);
      const bars=Math.abs(Math.round((d.pts[1].t-d.pts[0].t)/this.tf));
      const txt1=(diff>=0?'+':'')+fp(this.sym,diff)+' ('+pct.toFixed(2)+'%)';
      const txt2=bars+' bar'+(bars!==1?'s':'');
      g.save(); g.globalAlpha=1;
      g.font="bold 11px 'IBM Plex Mono',monospace"; g.textBaseline='middle';
      const mx=(P[0].x+P[1].x)/2, my=(P[0].y+P[1].y)/2-14;
      const tw1=g.measureText(txt1).width, tw2=g.measureText(txt2).width, tw=Math.max(tw1,tw2)+14;
      const bx=mx-tw/2, by=my-9;
      g.fillStyle=rgba(d.color,.85); g.beginPath(); g.roundRect?g.roundRect(bx,by,tw,36,4):g.rect(bx,by,tw,36); g.fill();
      g.fillStyle='#fff'; g.fillText(txt1,mx-tw1/2,my); g.fillText(txt2,mx-tw2/2,my+16);
      g.restore();
    } else if (d.type==='hline'){
      g.setLineDash([6,4]); g.beginPath(); g.moveTo(0,P[0].y); g.lineTo(pl.w,P[0].y); g.stroke(); g.setLineDash([]);
    } else if (d.type==='rect'){
      const rx=Math.min(P[0].x,P[1].x),ry=Math.min(P[0].y,P[1].y),rw=Math.abs(P[1].x-P[0].x),rh=Math.abs(P[1].y-P[0].y);
      g.fillStyle=rgba(d.color,.12); g.fillRect(rx,ry,rw,rh); g.strokeRect(rx,ry,rw,rh);
    } else if (d.type==='curve'){
      g.beginPath(); g.moveTo(P[0].x,P[0].y);
      if (P.length>2) g.quadraticCurveTo(2*P[2].x-(P[0].x+P[1].x)/2, 2*P[2].y-(P[0].y+P[1].y)/2, P[1].x, P[1].y);
      else g.lineTo(P[1].x,P[1].y); g.stroke();
    } else {
      this.drawPos(g,d,P);
    }
    g.restore();

    // hline price label in the scale margin
    if (d.type==='hline'){
      const py=d.pts[0].p, px=P[0].y;
      g.save(); g.fillStyle=d.color; g.fillRect(pl.w,px-9,w-pl.w,18);
      g.fillStyle=C.rootBg; g.font="11px 'IBM Plex Mono',monospace"; g.textBaseline='middle';
      g.fillText(fp(this.sym,py), pl.w+5, px+.5); g.restore();
    }
    // selection handles
    if (sel){
      g.save(); g.lineWidth=2; g.strokeStyle=d.color; g.fillStyle=C.rootBg;
      for (const q of P){ g.beginPath(); g.arc(q.x,q.y,5,0,6.2832); g.fill(); g.stroke(); }
      g.restore();
    }
  }

  drawPos(g,d,P){
    const long=d.type==='long', e=d.pts[0].p, tp=d.pts[1].p, sp=d.pts[2]?d.pts[2].p:e;
    const x0=P[0].x,x1=P[1].x,yE=P[0].y,yT=P[1].y,yS=P[2]?P[2].y:yE;
    const prof=long?tp-e:e-tp, loss=long?e-sp:sp-e, rr=loss?prof/loss:0, pc=v=>(v/e*100).toFixed(2)+'%';
    const lx=Math.min(x0,x1), lw=Math.abs(x1-x0);
    g.fillStyle=rgba(C.up,.2); g.fillRect(lx,Math.min(yE,yT),lw,Math.abs(yT-yE));
    g.fillStyle=rgba(C.down,.2); g.fillRect(lx,Math.min(yE,yS),lw,Math.abs(yS-yE));
    g.lineWidth=1.2; g.strokeStyle=C.up; g.strokeRect(lx,Math.min(yE,yT),lw,Math.abs(yT-yE));
    g.strokeStyle=C.down; g.strokeRect(lx,Math.min(yE,yS),lw,Math.abs(yS-yE));
    g.strokeStyle=d.color; g.lineWidth=1.6; g.beginPath(); g.moveTo(lx,yE); g.lineTo(lx+lw,yE); g.stroke();
    g.font="11px 'IBM Plex Mono',monospace"; g.textBaseline='middle';
    const bg=C.rootBg;
    const lab=(txt,y,col)=>{ const tw=g.measureText(txt).width+12,tx=lx+lw/2-tw/2; g.fillStyle=col; g.fillRect(tx,y-9,tw,18); g.fillStyle=bg; g.fillText(txt,tx+6,y+.5); };
    lab(`${long?'Long':'Short'}  R:R ${rr.toFixed(2)}`, yE, d.color);
    lab(`Target ${fp(this.sym,tp)}  ${prof>=0?'+':''}${fp(this.sym,prof)} (${pc(prof)})`, yT+(yT<yE?14:-14), C.up);
    lab(`Stop ${fp(this.sym,sp)}  −${fp(this.sym,loss)} (${pc(loss)})`, yS+(yS<yE?14:-14), C.down);
  }
}
