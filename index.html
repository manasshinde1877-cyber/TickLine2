const App = {
  tool:'cursor', color:'#d4a853', layout:4, active:null, panels:[],
  crosshair:{ relX:null, relY:null, active:false },

  save(){
    try{ localStorage.setItem(STORE, JSON.stringify({layout:this.layout, panels:this.panels.map(p=>({sym:p.sym,tf:p.tf,ind:p.ind}))})); }catch(e){}
  },

  setActive(p){
    if (this.active===p) return;
    this.active=p; this.panels.forEach(x=>x.el.classList.toggle('active',x===p));
    this.markTf(); this.markInd(); this.markWatch();
  },

  setLayout(n){
    this.layout=n; $('grid').className='l'+n+(this.tool!=='cursor'?' drawing':'');
    this.panels.forEach((p,i)=>{ p.el.hidden=i>=n; p.visible=i<n; });
    if (!this.active||!this.active.visible) this.setActive(this.panels[0]);
    document.querySelectorAll('#layouts button').forEach(b=>b.classList.toggle('on',+b.dataset.n===n));
    this.save();
  },

  setTf(tf, from){
    const targets = $('syncTf').checked ? this.panels : [from||this.active];
    targets.forEach(p=>{ p.tf=tf; p.tfSel.value=tf; p.creating=null; p.load(); });
    this.markTf(); this.save();
  },

  markTf(){ document.querySelectorAll('#tfs button').forEach(b=>b.classList.toggle('on',this.active&&+b.dataset.tf===this.active.tf)); },

  setTool(t){
    this.tool = t;
    const isCursor = t==='cursor';
    this.panels.forEach(p=>{
      p.creating=null; p.mw.style.cursor='';
      // toggle the built-in crosshair: show only in cursor mode
      p.chart.applyOptions(crosshairOpts(isCursor));
    });
    $('grid').classList.toggle('drawing', !isCursor);
    document.querySelectorAll('#tools button[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));
  },

  removeSelected(){
    const p=this.active; if(!p||p.selId==null) return;
    DR[p.sym]=(DR[p.sym]||[]).filter(d=>d.id!==p.selId); p.selId=null;
  },

  markWatch(){ document.querySelectorAll('#wl li').forEach(li=>li.classList.toggle('cur',this.active&&li.dataset.id===this.active.sym)); },

  markInd(){
    // Re-render the modal if it's open
    if (App._indModalPanel && !document.getElementById('ind-modal-backdrop').hidden){
      renderIndPopup(App._indModalPanel);
    }
  },

  /* ----- Centered Indicator Modal ----- */
  _indModalPanel: null,

  openIndModal(panel){
    this._indModalPanel = panel;
    const backdrop = document.getElementById('ind-modal-backdrop');
    const body = document.getElementById('ind-modal-body');
    // Update title
    const TF_LABELS = {1:'1s',5:'5s',60:'1m',300:'5m',600:'10m',900:'15m',3600:'1h',86400:'24h'};
    backdrop.querySelector('.ind-modal-title').textContent =
      'Indicators — ' + panel.sym + ' ' + (TF_LABELS[panel.tf] || panel.tf);
    // Mark button open
    App.panels.forEach(p => p.indBtn.classList.remove('open'));
    panel.indBtn.classList.add('open');
    backdrop.hidden = false;
    renderIndPopup(panel);
  },

  closeIndModal(){
    const backdrop = document.getElementById('ind-modal-backdrop');
    backdrop.hidden = true;
    App.panels.forEach(p => p.indBtn.classList.remove('open'));
    App._indModalPanel = null;
  },

  /* ----- Zen Mode ----- */
  _zen: false,

  toggleZen(){
    this._zen = !this._zen;
    const appEl = document.getElementById('app');
    appEl.classList.toggle('zen', this._zen);
    // Update panels after grid re-layout
    setTimeout(() => App.panels.forEach(p => p._resize()), 50);
    setTimeout(() => App.panels.forEach(p => {
      p._resize();
      // Keep zen labels up to date
      const TF_LABELS = {1:'1s',5:'5s',60:'1m',300:'5m',600:'10m',900:'15m',3600:'1h',86400:'24h'};
      if (p.zenLbl) p.zenLbl.textContent = p.sym + '  ' + (TF_LABELS[p.tf] || p.tf);
    }), 220);
    // Close indicator modal if open
    if (!this._zen) {} else { this.closeIndModal(); }
  },

  /* ----- Apply indicators to all charts ----- */
  applyIndToAll(sourcePanel){
    const src = sourcePanel.ind;
    this.panels.forEach(p => {
      if (p === sourcePanel) return;
      p.ind = mkInd(src);
      p.syncInd(true);
      p.buildSub();
    });
    this.save();
  },
};

/* ============================================================
   INDICATOR POPUP  — built dynamically with multi-instance support
   Accepts a panel instance; renders into that panel's own popup element.
   ============================================================ */
function renderIndPopup(panel){
  const p = panel;
  // Render into modal body (centered modal)
  const pop = document.getElementById('ind-modal-body');
  if (!pop) return;
  pop.innerHTML = '';

  const h3 = text => { const e=document.createElement('h3'); e.textContent=text; pop.appendChild(e); };

  h3('On Price Chart');

  // Simple checkboxes
  const checkRow = (key, label) => {
    const row=document.createElement('div'); row.className='ind-row';
    const lbl=document.createElement('label'); lbl.className='ind-chk';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!!p.ind[key];
    cb.onchange = () => { p.ind[key]=cb.checked; p.syncInd(true); App.save(); };
    lbl.appendChild(cb); lbl.appendChild(document.createTextNode(' '+label));
    row.appendChild(lbl);
    pop.appendChild(row);
  };

  checkRow('vol', 'Volume');
  checkRow('vwap', 'VWAP (daily reset)');
  checkRow('pivots', 'Pivot Points (Daily)');

  // Multi-instance indicators
  const renderMultiGroup = (title, listKey, makeDefault, paramDefs, colors) => {
    const list = p.ind[listKey] || (p.ind[listKey] = []);
    const grp = document.createElement('div'); grp.className = 'ind-group';
    const head = document.createElement('div'); head.className = 'ind-grp-head';
    head.innerHTML = `<span class="ind-grp-title">${title}</span>`;
    const addBtn = document.createElement('button');
    addBtn.type = 'button'; addBtn.className = 'ind-add-btn'; addBtn.textContent = '+ Add';
    addBtn.onclick = e => {
      e.stopPropagation();
      list.push(makeDefault(list.length));
      p.syncInd(true); App.save(); renderIndPopup(panel);
    };
    head.appendChild(addBtn); grp.appendChild(head);

    if (!list.length){
      const emp = document.createElement('div'); emp.className = 'ind-empty';
      emp.textContent = 'None active';
      grp.appendChild(emp);
    } else {
      list.forEach((item, idx) => {
        const row = document.createElement('div'); row.className = 'ind-inst-row';
        const palCol = colors[idx % colors.length];
        const col = item.color || palCol;
        const badge = document.createElement('span'); badge.className = 'ind-inst-badge'; badge.style.backgroundColor = col;
        row.appendChild(badge);

        paramDefs.forEach(([lbl, key, min, max, step]) => {
          const sp = document.createElement('span'); sp.className = 'plbl'; sp.textContent = lbl;
          row.appendChild(sp);
          const inp = document.createElement('input'); inp.type = 'number'; inp.className = 'pnum';
          inp.min = min; inp.max = max; inp.step = step || 1; inp.value = item[key];
          inp.onchange = () => {
            let v = parseFloat(inp.value);
            if (isNaN(v)) v = min;
            v = Math.max(min, Math.min(max, v));
            inp.value = v; item[key] = v;
            p.syncInd(true); App.save();
          };
          row.appendChild(inp);
        });

        // Colour picker
        const colInp = document.createElement('input'); colInp.type = 'color';
        colInp.value = col; colInp.title = 'Line colour';
        colInp.style.cssText = 'width:22px;height:22px;padding:0;border:1px solid var(--line);border-radius:3px;background:none;cursor:pointer;vertical-align:middle;margin-left:4px';
        colInp.oninput = () => { item.color = colInp.value; badge.style.backgroundColor = colInp.value; p.syncInd(true); App.save(); };
        row.appendChild(colInp);

        // Width spinner
        const wSp = document.createElement('span'); wSp.className = 'plbl'; wSp.textContent = 'W';
        row.appendChild(wSp);
        const wInp = document.createElement('input'); wInp.type = 'number'; wInp.className = 'pnum';
        wInp.min = 1; wInp.max = 4; wInp.step = 1; wInp.value = item.width || 2;
        wInp.style.width = '36px';
        wInp.onchange = () => { const v=Math.max(1,Math.min(4,parseInt(wInp.value)||2)); wInp.value=v; item.width=v; p.syncInd(true); App.save(); };
        row.appendChild(wInp);

        const del = document.createElement('button'); del.type = 'button'; del.className = 'ind-del-btn';
        del.title = 'Remove instance'; del.textContent = '×';
        del.onclick = e => {
          e.stopPropagation();
          list.splice(idx, 1);
          p.syncInd(true); App.save(); renderIndPopup(panel);
        };
        row.appendChild(del);
        grp.appendChild(row);
      });
    }
    pop.appendChild(grp);
  };

  renderMultiGroup('SMA', 'smaList', len => ({period: len===0?20:(len===1?50:200), color:null, width:2}), [['Period','period',2,500,1]], SMA_COLORS);
  renderMultiGroup('EMA', 'emaList', len => ({period: len===0?50:(len===1?20:200), color:null, width:2}), [['Period','period',2,500,1]], EMA_COLORS);
  renderMultiGroup('DEMA', 'demaList', () => ({period: 21, color:null, width:2}), [['Period','period',2,500,1]], DEMA_COLORS);
  renderMultiGroup('Bollinger Bands', 'bbList', () => ({period: 20, k: 2, color:null, width:1}), [['Period','period',2,500,1],['σ','k',0.5,10,0.5]], BB_COLORS);

  h3('Lower Pane');
  const mkNum = (paramKey, min, max, step) => {
    const inp = document.createElement('input'); inp.type='number'; inp.className='pnum';
    inp.min=min; inp.max=max; inp.step=step||1; inp.value=p.ind[paramKey]||min;
    inp.onchange = () => {
      let v = parseFloat(inp.value);
      if (isNaN(v)) v = min;
      v = Math.max(min, Math.min(max, v));
      inp.value = v; p.ind[paramKey] = v;
      p.buildSub(); App.save();
    };
    return inp;
  };

  const mkParams = specs => {
    const div = document.createElement('div'); div.className='ind-params';
    specs.forEach(([lbl,key,min,max,step]) => {
      const sp = document.createElement('span'); sp.className='plbl'; sp.textContent=lbl;
      div.appendChild(sp); div.appendChild(mkNum(key,min,max,step));
    });
    return div;
  };

  const radioRow = (subVal, label, params) => {
    const row=document.createElement('div'); row.className='ind-row';
    const lbl=document.createElement('label'); lbl.className='ind-chk';
    const rb=document.createElement('input'); rb.type='radio'; rb.name='sub'; rb.value=subVal;
    rb.checked = (p.ind.sub||'') === subVal;
    rb.onchange = () => {
      if (!rb.checked) return;
      p.ind.sub = subVal || null;
      p.buildSub(); App.save(); renderIndPopup(panel);
    };
    lbl.appendChild(rb); lbl.appendChild(document.createTextNode(' '+label));
    row.appendChild(lbl);
    if (params && rb.checked) row.appendChild(mkParams(params));
    pop.appendChild(row);
  };

  radioRow('rsi', 'RSI', [['Period','rsiN',2,200,1]]);
  // RSI level controls (shown only when RSI is active)
  if ((p.ind.sub||'') === 'rsi'){
    const rsiLevDiv = document.createElement('div'); rsiLevDiv.className = 'ind-params';
    const mkRsiN = (lbl, key, def) => {
      const sp = document.createElement('span'); sp.className = 'plbl'; sp.textContent = lbl;
      rsiLevDiv.appendChild(sp);
      const inp = document.createElement('input'); inp.type = 'number'; inp.className = 'pnum';
      inp.min = 1; inp.max = 99; inp.step = 1; inp.value = p.ind[key] ?? def;
      inp.onchange = () => {
        const v = Math.max(1, Math.min(99, parseInt(inp.value)||def));
        inp.value = v; p.ind[key] = v; p.buildSub(); App.save();
      };
      rsiLevDiv.appendChild(inp);
    };
    mkRsiN('OB', 'rsiUpper', 70);
    // Mid toggle checkbox
    const midSp = document.createElement('span'); midSp.className = 'plbl'; midSp.textContent = 'Mid';
    rsiLevDiv.appendChild(midSp);
    const midCb = document.createElement('input'); midCb.type = 'checkbox';
    midCb.checked = !!p.ind.rsiShowMid;
    midCb.style.cssText = 'width:14px;height:14px;cursor:pointer;accent-color:var(--accent)';
    midCb.onchange = () => { p.ind.rsiShowMid = midCb.checked; p.buildSub(); App.save(); };
    rsiLevDiv.appendChild(midCb);
    mkRsiN('Mid val', 'rsiMid', 50);
    mkRsiN('OS', 'rsiLower', 30);
    pop.appendChild(rsiLevDiv);
    // RSI colour pickers
    const rsiColDiv = document.createElement('div'); rsiColDiv.className = 'ind-params';
    const mkRsiCol = (lbl, key, def) => {
      const sp = document.createElement('span'); sp.className = 'plbl'; sp.textContent = lbl;
      rsiColDiv.appendChild(sp);
      const inp = document.createElement('input'); inp.type = 'color';
      inp.value = p.ind[key] || def;
      inp.style.cssText = 'width:22px;height:22px;padding:0;border:1px solid var(--line);border-radius:3px;background:none;cursor:pointer;vertical-align:middle';
      inp.oninput = () => { p.ind[key] = inp.value; p.buildSub(); App.save(); };
      rsiColDiv.appendChild(inp);
    };
    mkRsiCol('RSI', 'rsiColor', '#b48eff');
    mkRsiCol('OB', 'rsiOBColor', '#ef4444');
    mkRsiCol('OS', 'rsiOSColor', '#4ade80');
    mkRsiCol('Mid', 'rsiMidColor', '#888888');
    pop.appendChild(rsiColDiv);
  }
  radioRow('macd', 'MACD', [['Fast','macdF',2,200,1],['Slow','macdS',2,200,1],['Signal','macdG',2,200,1]]);
  radioRow('', 'None');

  // ── Apply to all charts ──────────────────────────────────
  const divider = document.createElement('div');
  divider.style.cssText = 'border-top:1px solid var(--line);margin:8px 2px 4px';
  pop.appendChild(divider);

  const applyAllRow = document.createElement('div');
  applyAllRow.style.cssText = 'padding:4px 6px 2px;display:flex;align-items:center;gap:8px';
  const applyAllBtn = document.createElement('button');
  applyAllBtn.type = 'button';
  applyAllBtn.textContent = '⬡ Apply to all charts';
  applyAllBtn.style.cssText = 'flex:1;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 10px;font-size:11px;color:var(--dim);cursor:pointer;text-align:center;font-family:var(--sans);transition:color .15s,border-color .15s,background .15s';
  applyAllBtn.onmouseenter = () => { applyAllBtn.style.color='var(--text)'; applyAllBtn.style.borderColor='var(--accent)'; };
  applyAllBtn.onmouseleave = () => { applyAllBtn.style.color='var(--dim)'; applyAllBtn.style.borderColor='var(--line)'; };
  applyAllBtn.onclick = e => {
    e.stopPropagation();
    App.applyIndToAll(p);
    // Brief visual feedback
    applyAllBtn.textContent = '✓ Applied to all charts';
    applyAllBtn.style.color = 'var(--up)';
    applyAllBtn.style.borderColor = 'var(--up)';
    setTimeout(() => {
      applyAllBtn.textContent = '⬡ Apply to all charts';
      applyAllBtn.style.color = 'var(--dim)';
      applyAllBtn.style.borderColor = 'var(--line)';
    }, 1800);
  };
  applyAllRow.appendChild(applyAllBtn);
  pop.appendChild(applyAllRow);
}

/* ============================================================
   MAIN UI BUILD
   ============================================================ */
function buildUI(){
  // layout buttons
  [[1,1,1],[2,2,1],[4,2,2],[6,3,2]].forEach(([n,c,r])=>{
    const b=document.createElement('button'); b.dataset.n=n;
    b.title=n+(n===1?' chart':' charts'); b.setAttribute('aria-label',b.title);
    let rects=''; const cw=16/c, rh=12/r;
    for(let i=0;i<c;i++) for(let j=0;j<r;j++) rects+=`<rect x="${i*cw+.8}" y="${j*rh+.8}" width="${cw-1.6}" height="${rh-1.6}" rx="1" fill="currentColor"/>`;
    b.innerHTML=`<svg width="18" height="14" viewBox="0 0 16 12">${rects}</svg>${n}`;
    b.onclick=()=>App.setLayout(n); $('layouts').appendChild(b);
  });

  // timeframe buttons
  TFS.forEach(([l,v])=>{ const b=document.createElement('button'); b.textContent=l; b.dataset.tf=v; b.onclick=()=>App.setTf(v); $('tfs').appendChild(b); });

  // drawing tool rail
  const tb=$('tools');
  const mk=(id,title,fn)=>{ const b=document.createElement('button'); b.title=title; b.setAttribute('aria-label',title); b.innerHTML=`<svg viewBox="0 0 24 24">${ICON[id]}</svg>`; b.onclick=fn; return b; };
  TOOLS.forEach(([id,title])=>{ const b=mk(id,title,()=>App.setTool(id)); b.dataset.tool=id; tb.appendChild(b); if(id==='cursor') tb.appendChild(document.createElement('hr')); });
  tb.appendChild(document.createElement('hr'));
  tb.appendChild(mk('trash','Delete selected (Del)',()=>App.removeSelected()));
  tb.appendChild(mk('clear','Clear all drawings on this symbol',()=>{ if(App.active){ DR[App.active.sym]=[]; App.active.selId=null; } }));
  const col=document.createElement('input'); col.type='color'; col.id='drawColor'; col.value=App.color;
  col.title='Drawing colour'; col.setAttribute('aria-label','Drawing colour');
  col.oninput=()=>{ App.color=col.value; const p=App.active; if(p&&p.selId!=null){ const d=(DR[p.sym]||[]).find(x=>x.id===p.selId); if(d) d.color=col.value; } };
  tb.appendChild(document.createElement('hr')); tb.appendChild(col);

  // Close indicator modal when clicking outside all panels
  // (handled by backdrop click listener added below)

  // Collapsible tool rail & watchlist
  const appEl = $('app');
  const toolsTab = $('tools-tab');
  const watchTab = $('watch-tab');
  if (toolsTab){
    toolsTab.onclick = () => {
      const hidden = appEl.classList.toggle('tools-hidden');
      toolsTab.textContent = hidden ? '▶' : '◀';
      toolsTab.title = hidden ? 'Show drawing tools' : 'Hide drawing tools';
      setTimeout(()=>App.panels.forEach(p=>p._resize()),200);
    };
  }
  if (watchTab){
    watchTab.onclick = () => {
      const hidden = appEl.classList.toggle('watch-hidden');
      watchTab.textContent = hidden ? '◀' : '▶';
      watchTab.title = hidden ? 'Show watchlist' : 'Hide watchlist';
      setTimeout(()=>App.panels.forEach(p=>p._resize()),200);
    };
  }

  // watchlist
  SYMS.forEach(s=>{
    const li=document.createElement('li'); li.dataset.id=s.id;
    li.innerHTML=`<span class="n">${s.id}</span><span class="p mono">—</span><span class="d">${s.name}</span><span class="c mono"></span>`;
    li.onclick=()=>{ const p=App.active; if(!p) return; p.sym=s.id; p.symSel.value=s.id; p.selId=null; p.creating=null; p.load(); App.save(); App.markWatch(); };
    $('wl').appendChild(li);
  });

  // keyboard shortcuts
  document.addEventListener('keydown', e=>{
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key==='Escape'){
      App.setTool('cursor');
      App.panels.forEach(p => p._closeIndPop && p._closeIndPop());
      App.closeIndModal();
    }
    if ((e.key==='Delete'||e.key==='Backspace') && App.active){ App.removeSelected(); e.preventDefault(); }
    if (e.key==='z'||e.key==='Z') App.toggleZen();
  });

  // Zen button
  const zenBtn = $('zenBtn');
  if (zenBtn) zenBtn.onclick = () => App.toggleZen();

  const zenExit = $('zen-exit');
  if (zenExit) zenExit.onclick = () => App.toggleZen();

  // Indicator modal — close on backdrop click or close button
  const indBackdrop = $('ind-modal-backdrop');
  if (indBackdrop){
    indBackdrop.addEventListener('click', e => {
      if (e.target === indBackdrop) App.closeIndModal();
    });
    const closeBtn = $('ind-modal-close-btn');
    if (closeBtn) closeBtn.onclick = () => App.closeIndModal();
  }
}

/* ============================================================
   WATCHLIST UPDATE
   ============================================================ */
function updateWatch(){
  document.querySelectorAll('#wl li').forEach(li=>{
    const s=S[li.dataset.id]; if(s.price==null) return;
    const p=li.querySelector('.p'), c=li.querySelector('.c'), chg=s.chgPct;
    p.textContent=fp(s.id,s.price);
    if (chg!=null){ c.textContent=(chg>=0?'+':'')+chg.toFixed(2)+'%'; c.className='c mono '+(chg>=0?'up':'down'); }
    p.classList.remove('flashu','flashd');
    if (s.prev!=null && s.price!==s.prev) p.classList.add(s.price>s.prev?'flashu':'flashd');
  });
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  let cfgPanels=DEFAULTS.slice(0,6), cfgLayout=4;
  try{
    const raw=JSON.parse(localStorage.getItem(STORE)||'null');
    if (raw && Array.isArray(raw.panels) && raw.panels.length>=1){
      cfgLayout=Math.min(6, raw.layout||4); // clamp to max 6
      cfgPanels=Array.from({length:6},(_,i)=>{
        const p=raw.panels[i], def=DEFAULTS[i]||DEFAULTS[0];
        if(!p) return def;
        const sym=S[p.sym]?p.sym:def.sym;
        const tf=TFS.some(t=>t[1]===p.tf)?p.tf:def.tf;
        const ind=p.ind ? mkInd(p.ind) : mkInd(def.ind);
        return {sym,tf,ind};
      });
    }
  }catch(e){}

  buildUI();
  cfgPanels.forEach((c,i)=>App.panels.push(new Panel(i,c)));
  App.panels.forEach(p=>p.buildSub());
  App.setLayout(cfgLayout); App.setTool('cursor');
  connectFeed();

  setInterval(()=>{
    flushTicks(); App.panels.forEach(p=>p.onTick()); updateWatch();
    $('clock').textContent=new Date().toLocaleTimeString('en-GB');
  }, 200);

  (function frame(){ App.panels.forEach(p=>{ if(p.visible) p.render(); }); requestAnimationFrame(frame); })();
}

boot();
</script>
